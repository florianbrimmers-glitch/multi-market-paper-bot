name: Paper Trading Loop

# One evaluation tick across all instruments. Safe by default: DRY_RUN stays true unless you
# set the repository variable DRY_RUN=false (a manual run may override it).
# ETFs/stocks only trade during US market hours; BTC/USD trades 24/7.
#
# Primary trigger: an external timer (cron-job.org) calling the workflow_dispatch API — see
# README "Scheduling". GitHub's own schedule is heavily throttled on quiet repos, so it is
# kept only as a sparse hourly fallback during the US session.

on:
  schedule:
    - cron: "7 13-20 * * 1-5"  # fallback only
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Leave empty to use the DRY_RUN repo variable; true = log only, false = paper orders"
        required: false
        default: ""

concurrency:
  group: paper-trading-loop
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Keep the decision log across runs so the night brief can report the day's actions.
      - uses: actions/cache/restore@v4
        with:
          path: trade_decisions.jsonl
          key: decision-log-${{ github.run_id }}
          restore-keys: decision-log-
      - run: python run_trade.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: trade_decisions.jsonl
          key: decision-log-${{ github.run_id }}
