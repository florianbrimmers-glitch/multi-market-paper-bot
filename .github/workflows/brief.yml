name: Daily Briefs

# Morning brief before the US open, night brief after the close. Triggered by the external
# timer (cron-job.org) via the workflow_dispatch API — GitHub's own schedule ran hours late.
# Output appears in the job log and the run summary.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "morning or night (empty = decide by time: before 17:00 UTC = morning)"
        required: false
        default: ""

jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            trade_decisions.jsonl
            brief_state.json
          key: bot-state-brief-${{ github.run_id }}
          restore-keys: bot-state-
      - name: Generate brief
        run: |
          KIND="${{ github.event.inputs.kind }}"
          if [ -z "$KIND" ]; then
            if [ "$(date -u +%H)" -lt 17 ]; then KIND=morning; else KIND=night; fi
          fi
          python run_brief.py "$KIND" | tee brief.txt
          { echo "## ${KIND^} brief"; echo; cat brief.txt; } >> "$GITHUB_STEP_SUMMARY"
